name: Nova Vision Contract

on:
  push:
    branches: [main]
  pull_request:

jobs:
  phase2-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run test:phase2
