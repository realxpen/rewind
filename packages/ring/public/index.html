<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>REWIND • Observe</title>
<style>
:root{color-scheme:dark;font:16px system-ui;background:#10141c;color:#f1f5fc}*{box-sizing:border-box}body{margin:0}main{max-width:1160px;margin:auto;padding:32px 24px}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:32px}h1{font-size:26px;letter-spacing:.12em;margin:0}small,p{color:#b4c0d5}h2{font-size:20px}button,select,input,a{font:inherit}button,select,input{padding:12px;border:1px solid #526078;border-radius:8px;background:#202b3c;color:inherit}button{cursor:pointer}button.primary{background:#92ecc6;color:#10261d;border:0;font-weight:650}button:disabled{opacity:.45;cursor:default}.controls{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin:16px 0}video{width:100%;max-height:560px;background:#05070a;border-radius:12px;min-height:220px}#status{min-height:24px;color:#92ecc6}section{margin-top:28px;border-top:1px solid #354054;padding-top:16px}#frame{max-width:100%;max-height:360px;border-radius:10px}pre{white-space:pre-wrap;overflow-wrap:anywhere;padding:18px;background:#192230;border-radius:10px}a{color:#92ecc6}[hidden]{display:none!important}label{display:flex;align-items:center;gap:8px}@media(max-width:600px){main{padding:20px 14px}.controls>*{max-width:100%}header{align-items:start;gap:16px}small{max-width:130px}}
</style></head><body><main><header><h1>REWIND</h1><small>Observe · Local preview</small></header>
<h2>Connect your camera</h2><div class="controls"><label>Device <select id="devices" aria-label="Ring device"></select></label><button id="reload">Refresh devices</button><button class="primary" id="start" disabled>Start live view</button><button id="stop" disabled>Stop</button></div>
<p id="status" role="status" aria-live="polite">Discovering devices…</p><video id="video" autoplay muted playsinline controls></video>
<div class="controls"><button class="primary" id="capture" disabled>Capture frame</button></div>
<section id="snapshot" hidden><h2>Captured frame</h2><p id="captureTime"></p><img id="frame" alt="Captured Ring frame"><div class="controls"><a id="download" download="rewind-frame.jpg">Download frame</a><button id="discard">Discard frame</button></div>
<label>Space name <input id="space" value="ring-playground" maxlength="80" pattern="[a-zA-Z0-9._-]+"></label><div class="controls"><button class="primary" id="observe">Observe with Nova</button></div><p>Only this captured frame is sent to Nova when you click Observe. The server does not save the image.</p>
<pre id="result" hidden></pre><p>This is an observation preview. No SAVE checkpoint has been created.</p></section>
</main><script src="/preview.js"></script></body></html>
